# 系统清单：网站上的所有系统信息都来自这里。新增系统就复制一段改字段。
#   id        网址里用的英文标识，例如 ppt -> /systems/ppt/
#   short     地图和图标上显示的简称（最多 5 个字）
#   category  对应 categories.yaml 里的 id
#   status    online = 已上线（默认）；building = 建设中（不显示「立即使用」，url 可不填）
#   network   intranet = 只能内网访问；public = 公网可访问
#   art       封面插画：ppt avatar anim nano qbank parse graph python thesis arxiv course；不填则用通用插画
#   description  卡片上的一句话简介
#   intro     详情页的完整介绍
#   audience  适合谁用
#   features  功能亮点；steps 快速上手步骤
# 介绍文字根据系统名称和用途整理，负责人、联系方式、更新时间待补充，请各系统负责人核对。

